version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: codepulse-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: codepulse
    volumes:
      - mongo_data:/data/db

  # Redis Cache Service
  redis:
    image: redis:alpine
    container_name: codepulse-redis
    restart: always
    ports:
      - "6379:6379"

  # Backend Express API Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: codepulse-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URL: mongodb://mongodb:27017/codepulse
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: your_access_token_secret_here
      REFRESH_TOKEN_SECRET: your_refresh_token_secret_here
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      SALT_ROUNDS: 10
    depends_on:
      - mongodb
      - redis

  # Frontend Next.js Web Application
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: codepulse-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo_data:
